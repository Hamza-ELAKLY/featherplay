name: Website

# Featherplay's site on GitHub Pages: site/ plus PRIVACY.md and CODE_SIGNING.md, built by
# scripts/site.py. Pull requests only build it, to catch a page that won't build.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/site.py
      - PRIVACY.md
      - CODE_SIGNING.md
      - assets/showcase.webp
      - assets/social-preview.png
      - ui/icon.png
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - scripts/site.py
      - PRIVACY.md
      - CODE_SIGNING.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/site.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
