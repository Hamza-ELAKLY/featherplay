[package]
name = "featherplay"
version = "1.0.0"
edition = "2024"
description = "An ultra-light desktop player for the audio of YouTube videos and playlists"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hamza-ELAKLY/featherplay"
readme = "README.md"
keywords = ["youtube", "audio", "player", "music", "portable"]
categories = ["multimedia::audio"]

[dependencies]
raw-window-handle = "0.6"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 for checking updates; already built in for HTTPS, so this adds nothing.
ring = { version = "0.17", default-features = false }
# Pinned: the window code reaches into winit through Slint (unstable-winit-030), which
# can change between Slint releases.
# accessibility: screen readers can read and use the window (about 1 MB of memory).
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030", "accessibility"] }
souvlaki = "0.9.3"
ureq = "3.5.0"
zune-core = "0.5"
zune-jpeg = "0.5"

[build-dependencies]
embed-resource = "3.0.12"
slint-build = "1.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon, over D-Bus; async-io is a much smaller runtime than tokio.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"

# Full debug info made debug builds several GB; line tables still give readable backtraces,
# for this crate only. No incremental cache: it was hundreds of MB for little gain here.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[dev-dependencies]
# Drives the window headlessly in tests: pointer, hover, drag.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
